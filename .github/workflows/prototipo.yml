# Publica o protótipo estático (pasta prototipo/) no GitHub Pages a cada mudança no app, no site ou no catálogo.
# Ative uma vez: Settings › Pages › Source: GitHub Actions.
# Repositório privado: o GitHub Pages exige plano pago (Pro, Team). Sem ele, use Netlify Drop (prototipo/PUBLICAR.md).
name: Protótipo no GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", "site/**", "server/catalogo_padrao.json", "ferramentas/gerar_prototipo.py", ".github/workflows/prototipo.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Gerar o protótipo
        run: python3 ferramentas/gerar_prototipo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: prototipo }
      - id: deploy
        uses: actions/deploy-pages@v4
