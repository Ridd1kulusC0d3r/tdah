<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agora TDAH</title>
<meta name="description" content="Uma ação por vez: tarefas, cursos, rotinas, foco, sono, humor e atividade para quem tem TDAH.">
<meta name="theme-color" content="#edefea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Agora 1.3 — linguagem visual "marca-texto".
   Uma família só (Atkinson Hyperlegible Next, criada para leitura fácil), papel pedra frio, tinta verde-escura,
   botão de ação em verde-pinho e o amarelo de marca-texto reservado para o que é AGORA: o passo atual e a tela atual.
   Temas (data-skin): auto, claro, clean, escuro, matrix, oceano, lavanda. */
:root{
  --bg:#edefea; --surface:#ffffff; --sunk:#e3e6df; --ink:#18211d; --muted:#59645f; --line:#d5d9d1;
  --accent:#0b6b57; --accent-ink:#ffffff; --accent-soft:#ffe977; --hl:#ffe977; --deep:#18211d;
  --good:#2e7d32; --warn:#946200; --bad:#b42318;
  --m1:#5b6cb8; --m2:#8e9bd3; --m3:#b7bdc4; --m4:#f2c94c; --m5:#ee8f2a; --face:#18211d;
  --t1:#3355c4; --t2:#6a45d6; --t3:#0b7d8f; --t4:#2e7d32; --t5:#b84a0c; --t6:#b8235a;
  --shadow:none; --lift:0 1px 0 var(--line), 0 18px 40px -30px rgb(24 33 29 / .35); --glow:none;
  --f-display:"Atkinson Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body:"Atkinson Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:var(--f-body);
  --r:14px; --rs:10px; --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --banner:var(--sunk); --banner-ink:var(--ink);
  --bg:#111513; --surface:#191e1b; --sunk:#232925; --ink:#e7ebe6; --muted:#9aa49e; --line:#2c332f;
  --accent:#4fbf9f; --accent-ink:#06150f; --accent-soft:#3d3a1c; --hl:#5b5222; --deep:#e7ebe6;
  --good:#7ad083; --warn:#e9c25a; --bad:#ff8a7a;
  --m1:#8c9cf0; --m2:#a9b4f2; --m3:#b4bcc4; --m4:#f2cf63; --m5:#f5a24a; --face:#141815;
  --t1:#8aa2ff; --t2:#a88cf5; --t3:#4cc6d6; --t4:#7ad083; --t5:#f59e5b; --t6:#f28bb2;
  --lift:0 1px 0 var(--line), 0 20px 40px -28px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --banner:var(--sunk); --banner-ink:var(--ink);
  --bg:#111513; --surface:#191e1b; --sunk:#232925; --ink:#e7ebe6; --muted:#9aa49e; --line:#2c332f;
  --accent:#4fbf9f; --accent-ink:#06150f; --accent-soft:#3d3a1c; --hl:#5b5222; --deep:#e7ebe6;
  --good:#7ad083; --warn:#e9c25a; --bad:#ff8a7a;
  --m1:#8c9cf0; --m2:#a9b4f2; --m3:#b4bcc4; --m4:#f2cf63; --m5:#f5a24a; --face:#141815;
  --t1:#8aa2ff; --t2:#a88cf5; --t3:#4cc6d6; --t4:#7ad083; --t5:#f59e5b; --t6:#f28bb2;
  --lift:0 1px 0 var(--line), 0 20px 40px -28px rgb(0 0 0 / .7); color-scheme:dark}
/* temas escolhidos pelo usuário: vêm depois e vencem */
:root[data-skin="claro"]{
  --banner:var(--deep); --banner-ink:var(--bg);
  --bg:#edefea; --surface:#ffffff; --sunk:#e3e6df; --ink:#18211d; --muted:#59645f; --line:#d5d9d1;
  --accent:#0b6b57; --accent-ink:#ffffff; --accent-soft:#ffe977; --hl:#ffe977; --deep:#18211d; --good:#2e7d32; --warn:#946200; --bad:#b42318;
  --m1:#5b6cb8; --m2:#8e9bd3; --m3:#b7bdc4; --m4:#f2c94c; --m5:#ee8f2a; --face:#18211d;
  --t1:#3355c4; --t2:#6a45d6; --t3:#0b7d8f; --t4:#2e7d32; --t5:#b84a0c; --t6:#b8235a;
  --lift:0 1px 0 var(--line), 0 18px 40px -30px rgb(24 33 29 / .35); color-scheme:light}
:root[data-skin="clean"]{
  --banner:var(--deep); --banner-ink:var(--bg);
  --bg:#ffffff; --surface:#ffffff; --sunk:#f2f2f0; --ink:#1a1a1a; --muted:#6b6b68; --line:#e4e4e0;
  --accent:#1a1a1a; --accent-ink:#ffffff; --accent-soft:#efefeb; --hl:#e6e6e1; --deep:#1a1a1a; --good:#2e7d32; --warn:#8a5a00; --bad:#b42318;
  --m1:#93a3d6; --m2:#b4c0e4; --m3:#d4d8de; --m4:#f2d27a; --m5:#efa64a; --face:#1a1a1a;
  --t1:#4c6ef5; --t2:#845ef7; --t3:#1098ad; --t4:#37b24d; --t5:#e8590c; --t6:#d6336c;
  --lift:0 0 0 1px var(--line); --r:10px; --rs:8px; color-scheme:light}
:root[data-skin="escuro"]{
  --banner:var(--sunk); --banner-ink:var(--ink);
  --bg:#0f1311; --surface:#181d1a; --sunk:#212723; --ink:#eaeee9; --muted:#9aa49e; --line:#2a312d;
  --accent:#4fbf9f; --accent-ink:#06150f; --accent-soft:#3d3a1c; --hl:#5b5222; --deep:#eaeee9; --good:#7ad083; --warn:#e9c25a; --bad:#ff8a7a;
  --m1:#8c9cf0; --m2:#a9b4f2; --m3:#b4bcc4; --m4:#f2cf63; --m5:#f5a24a; --face:#121613;
  --t1:#8aa2ff; --t2:#a88cf5; --t3:#4cc6d6; --t4:#7ad083; --t5:#f59e5b; --t6:#f28bb2;
  --lift:0 1px 0 var(--line), 0 20px 40px -28px rgb(0 0 0 / .7); color-scheme:dark}
:root[data-skin="matrix"]{
  --bg:#020804; --surface:#04120a; --sunk:#08200f; --ink:#b8ffcb; --muted:#4fb873; --line:#0e3a1d;
  --accent:#00ff66; --accent-ink:#001a08; --accent-soft:#05301a; --hl:#0b4a24; --deep:#00ff66; --good:#00ff66; --warn:#d4ff00; --bad:#ff4d6d;
  --m1:#1f6b43; --m2:#2e9a5d; --m3:#57c47f; --m4:#8cff9f; --m5:#00ff66; --face:#011007;
  --t1:#00ff66; --t2:#7dffb0; --t3:#00d4ff; --t4:#b6ff3b; --t5:#ffe066; --t6:#ff7ad9;
  --lift:0 0 0 1px #0e3a1d, 0 0 22px -10px rgb(0 255 102 / .45); --glow:0 0 10px rgb(0 255 102 / .55);
  --f-display:"Atkinson Mono", ui-monospace, Consolas, monospace; --f-body:"Atkinson Mono", ui-monospace, Consolas, monospace; --r:4px; --rs:3px; --fs:15px; color-scheme:dark}
:root[data-skin="oceano"]{
  --banner:var(--sunk); --banner-ink:var(--ink);
  --bg:#08191f; --surface:#0e252d; --sunk:#14313b; --ink:#e1f1f4; --muted:#8db0bb; --line:#1c4049;
  --accent:#3cc9b4; --accent-ink:#03201b; --accent-soft:#16413f; --hl:#2a5a54; --deep:#cfeaf0; --good:#63e6be; --warn:#ffd43b; --bad:#ff8787;
  --m1:#5c7cfa; --m2:#74c0fc; --m3:#a5d8e6; --m4:#ffe066; --m5:#ffa94d; --face:#062030;
  --t1:#74c0fc; --t2:#b197fc; --t3:#3cc9b4; --t4:#8ce99a; --t5:#ffa94d; --t6:#faa2c1;
  --lift:0 1px 0 var(--line), 0 20px 40px -28px rgb(0 0 0 / .6); color-scheme:dark}
:root[data-skin="lavanda"]{
  --banner:var(--deep); --banner-ink:var(--bg);
  --bg:#f1eff7; --surface:#ffffff; --sunk:#e9e5f3; --ink:#231c3d; --muted:#665e86; --line:#dbd5ec;
  --accent:#5b3cc4; --accent-ink:#ffffff; --accent-soft:#e6dcff; --hl:#e6dcff; --deep:#231c3d; --good:#2e7d32; --warn:#946200; --bad:#b42318;
  --m1:#7c8be0; --m2:#a3aeea; --m3:#c5c2d6; --m4:#f2cb64; --m5:#ee8f2a; --face:#231c3d;
  --t1:#4263eb; --t2:#6a45d6; --t3:#1098ad; --t4:#2f9e44; --t5:#d9480f; --t6:#c2255c;
  --lift:0 1px 0 var(--line), 0 18px 40px -30px rgb(60 30 140 / .35); color-scheme:light}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
:root[data-skin="matrix"] body{background:repeating-linear-gradient(0deg, rgb(0 255 102 / .025) 0 1px, transparent 1px 3px), var(--bg)}
:root[data-skin="matrix"] .banner{background:var(--surface);color:var(--ink);border:1px solid var(--accent)}
:root[data-skin="matrix"] .banner .btn{color:var(--accent);border-color:var(--accent)}
:root[data-skin="matrix"] h1,:root[data-skin="matrix"] h2{text-shadow:var(--glow);letter-spacing:0}
body.big{--fs:19px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:780;line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.022em}
h1{font-size:2rem} h2{font-size:1.32rem} h3{font-size:1.04rem;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.84rem;font-weight:600;color:var(--muted);letter-spacing:0}
.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* o traço de marca-texto: atrás do texto, levemente inclinado, como caneta de verdade */
.hl{background:linear-gradient(100deg, transparent .2em, var(--hl) .2em, var(--hl) calc(100% - .15em), transparent calc(100% - .15em)) 0 62% / 100% 46% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* shell */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 26px}
.brand svg{align-self:center}
.brand b{font:800 1.42rem/1 var(--f-display);letter-spacing:-.03em}
.brand i{font-style:normal;font-size:.8rem;font-weight:600;color:var(--muted)}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--rs);border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.navbtn svg{width:21px;height:21px;flex:none}
.navbtn span{padding-inline:2px}
.navbtn[aria-current="page"]{color:var(--ink);font-weight:750}
.navbtn[aria-current="page"] span{background:linear-gradient(100deg, transparent 2px, var(--hl) 2px, var(--hl) calc(100% - 1px), transparent calc(100% - 1px)) 0 70% / 100% 50% no-repeat}
.navbtn:hover{color:var(--ink);background:var(--sunk)}
.rail .foot{margin-top:auto;display:grid;gap:10px;font-size:.78rem;color:var(--muted);padding:8px 10px}
.skins-mini{display:flex;gap:6px;flex-wrap:wrap}
.skins-mini button{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;padding:0}
.skins-mini button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
main{padding-block:30px 120px;padding-inline:clamp(16px,4vw,48px);max-width:880px;width:100%}
.view{display:grid;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0;background:var(--surface)}
  .brand,.rail .foot{display:none}
  .navbtn{flex-direction:column;gap:3px;padding:6px 2px;font-size:.7rem;flex:1;align-items:center;min-width:0}
  .navbtn:hover{background:none}
  .navbtn span{white-space:nowrap}
  main{padding-block:18px 104px}
  .tile .ti svg{display:none}
  .tile{padding:12px}
  .tile b{font-size:1.55rem}
  h1{font-size:1.6rem}
}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:650;cursor:pointer;min-height:44px;transition:background-color .15s, border-color .15s}
.btn:hover{border-color:var(--muted)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent) 88%, var(--ink))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.huge{font:750 1.18rem/1 var(--f-display);padding:20px 26px;border-radius:var(--r);min-height:64px;width:100%;letter-spacing:-.01em}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--surface);cursor:pointer;font-weight:650;font-size:.86rem;min-height:36px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .dotc{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"] .dotc{box-shadow:0 0 0 2px var(--bg)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:.76rem;font-weight:650;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.pro{background:var(--hl);color:var(--ink)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.type{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px 2px 6px;font-size:.76rem;font-weight:650;color:var(--c);background:color-mix(in srgb, var(--c) 11%, transparent);white-space:nowrap}
.type svg{width:13px;height:13px}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;white-space:nowrap;padding:2px 0}
.prio::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.prio.alta{color:var(--bad)} .prio.media{color:var(--warn)} .prio.baixa{color:var(--muted)}
.prio.baixa::before{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],input[type=url],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:10px 12px;min-height:44px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:6px;font-weight:650;font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.banner{margin-bottom:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--banner,var(--deep));color:var(--banner-ink,var(--bg));border-radius:var(--rs);padding:12px 16px}
.banner .btn{background:transparent;color:var(--banner-ink,var(--bg));border-color:color-mix(in srgb, var(--banner-ink,var(--bg)) 45%, transparent);min-height:36px;padding:6px 12px}
.banner .btn:hover{border-color:var(--banner-ink,var(--bg))}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--rs);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:calc(var(--rs) - 3px);font-weight:650;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c, var(--accent))}

/* Agora */
.hello h1{font-size:clamp(1.9rem,5vw,2.7rem);letter-spacing:-.03em}
.now{--c:var(--accent);border:1.5px solid var(--ink);border-radius:calc(var(--r) + 4px);background:var(--surface);box-shadow:var(--lift);display:grid;overflow:hidden}
.now .top{padding:20px 24px 14px;display:grid;gap:10px}
.now .body{padding:4px 24px 24px;display:grid;gap:16px}
.now .kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.now .kind .label{margin-right:4px}
.now h2{font-size:clamp(1.55rem,4.2vw,2rem);letter-spacing:-.025em;overflow-wrap:anywhere}
.why{color:var(--muted);font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.why svg{margin-top:3px;color:var(--accent)}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.segbar i.on{background:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li.cur{font-weight:700;font-size:1.05rem}
.steps li.cur .tx{-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(100deg, transparent .15em, var(--hl) .15em, var(--hl) calc(100% - .1em), transparent calc(100% - .1em)) 0 64% / 100% 48% no-repeat}
.steps li:not(.cur){color:var(--muted)}
.steps li button.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:var(--surface);cursor:pointer;flex:none}
.steps li.cur button.tick{border:2px solid var(--ink)}
.steps li button.tick:hover{background:var(--good);border-color:var(--good)}
.durs{display:flex;gap:6px}
.durs .chip{min-height:34px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0;align-content:start}
.tile .ti{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tile .ti svg{color:var(--muted);width:16px;height:16px}
.tile b{display:block;font:750 1.85rem/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile b small{font-weight:500;letter-spacing:0;color:var(--muted)}
.tile svg.spark{width:100%;height:24px}
.queue{display:grid;gap:0;border-top:1px solid var(--line)}
.qitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.qitem .t{min-width:0;overflow-wrap:anywhere;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.moodq{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.face-btn{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer;line-height:0;transition:transform .12s}
.face-btn:hover{transform:translateY(-2px)}
.fab{position:fixed;right:clamp(16px,4vw,40px);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:var(--rs);background:var(--ink)!important;border-color:var(--ink)!important;color:var(--bg)!important;box-shadow:0 10px 24px -10px rgb(0 0 0 / .45)}
@media (min-width:761px){.fab{bottom:28px}}
.note{border-left:3px solid var(--accent);padding:12px 16px;background:var(--surface);border-radius:0 var(--rs) var(--rs) 0;display:grid;gap:2px}

/* tarefas e cursos */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{min-width:0;overflow-wrap:anywhere;display:grid;gap:4px}
.task.done .t b{text-decoration:line-through;color:var(--muted)}

a.btn{text-decoration:none;color:inherit;justify-self:start}

    const act = rnd() < .55 ? [0, 20, 30, 45][Math.floor(rnd() * 4)] : 0;
    const base = 2 + (sleepH >= 7 ? 1 : 0) + (act >= 20 ? .7 : 0) + (rnd() - .5) * 1.4;
    const mood = Math.max(1, Math.min(5, Math.round(base)));
    if (rnd() < .86) S.checkins[d] = { mood, energy: Math.max(1, Math.min(5, Math.round(base + (rnd() - .5)))),
      sleepH, sleepQ: Math.max(1, Math.min(5, Math.round(sleepH - 3.5 + (rnd() - .5)))),
      activityMin: act, activityType: act ? ["caminhada", "academia", "bike"][Math.floor(rnd() * 3)] : "", meds: rnd() < .8, note: "" };
    const nS = Math.floor((sleepH >= 7 ? 2.4 : 1.2) + rnd() * 2);
    for (let k = 0; k < nS; k++) { const ty = tiposSess[Math.floor(rnd() * tiposSess.length)];
      S.sessions.push({ date: d, min: [15, 25, 25, 50][Math.floor(rnd() * 4)], feel: ["fluiu", "ok", "travei"][Math.floor(rnd() * 3)], type: ty, taskId: ty === "estudo" ? "c:c1" : undefined }); }
    if (rnd() < .7) S.routineRuns.push({ date: d, routineId: "r1", done: 4, total: 4 });
    if (rnd() < .45) S.routineRuns.push({ date: d, routineId: "r2", done: 3, total: 3 });
    if (rnd() < .5) S.routineRuns.push({ date: d, routineId: "rp1", done: 3, total: 3 });
  }
  [["Trocar a lâmpada da cozinha", "casa"], ["Mandar slides para o Pedro", "trabalho"], ["Renovar receita", "saude"], ["Declarar gasto do mês", "financas"], ["Entregar exercício do curso", "estudo"]].forEach(([t, ty], i) =>
    S.tasks.push({ id: "td" + i, title: t, energy: "baixa", type: ty, priority: "media", created: diasAtras(12 + i), steps: [], done: true, doneAt: diasAtras(2 + i * 2) }));
  S.screenings.push({ date: diasAtras(19), type: "ASRS-A", answers: [3, 3, 2, 4, 3, 2], positives: 5, positive: true });
  S.notes.push({ from: "Dra. Ana Ribeiro (exemplo)", text: "Nesta semana, repare em quais horários a tarefa mais pesada flui melhor. Só observar, sem cobrança.", date: diasAtras(2) });
  return S;
}

}

/* ================= lógica de priorização ================= */
function minutosDia(d = hoje()) { return S.sessions.filter(s => s.date === d).reduce((a, s) => a + s.min, 0); }
const minutosHoje = minutosDia;
function diaAtivo(d) {
  return S.sessions.some(s => s.date === d) || !!S.checkins[d] || S.routineRuns.some(r => r.date === d) || S.tasks.some(t => t.doneAt === d);
}
function diasVoltei() {  // presença sem exigir sequência: quantos dos últimos 14 dias tiveram algum registro
  return [...Array(14)].filter((_, i) => diaAtivo(diasAtras(i))).length;
}
function sequencia() {
  let n = 0, i = diaAtivo(hoje()) ? 0 : 1;
  while (diaAtivo(diasAtras(i))) { n++; i++; }
  return n;
}
function rotinaDaVez() {
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), t = hoje();
  return S.routines.find(r => {
    if (!r.time) return false;
    const [h, m] = r.time.split(":").map(Number), a = h * 60 + m;
    const feita = S.routineRuns.some(x => x.routineId === r.id && x.date === t);
    return !feita && mins >= a - 20 && mins <= a + 90;
  });
}
function filaTarefas() {
  const t = hoje(), en = S.checkins[t]?.energy ?? 3;
  const cands = S.tasks.filter(x => !x.done && !(x.snooze && x.snooze > t));
  S.courses.filter(c => c.done < c.total && !(c.snooze && c.snooze > t)).forEach(c => cands.push(itemPorId("c:" + c.id)));
  return cands.map(x => {
    let p = 0; const motivo = [];
    if (x.pin) { p += 100; motivo.push("você escolheu fazer agora"); }
    if (x.priority === "alta") { p += 5; motivo.push("é prioridade alta"); } else if (x.priority === "media") p += 2;
    if (x.from) { p += 3; motivo.push("veio da sua psicóloga"); }
    const due = x.kind === "curso" ? x.course.deadline : x.due;
    if (due) { const dd = diff(due, t);
      if (dd < 0) { p += 7; motivo.push("está atrasada"); } else if (dd === 0) { p += 6; motivo.push("vence hoje"); }
      else if (dd <= 3) { p += 4; motivo.push(`vence em ${dd} ${dd === 1 ? "dia" : "dias"}`); }
      else if (x.kind === "curso") { const ritmo = (x.course.total - x.course.done) / Math.max(1, dd / 7); if (ritmo >= 3) { p += 3; motivo.push(`precisa de ${Math.ceil(ritmo)} aulas por semana para o prazo`); } } }
    if (en <= 2 && x.energy === "baixa") { p += 3; motivo.push("cabe na sua energia baixa de hoje"); }
    if (en <= 2 && x.energy === "alta") p -= 4;
    if (en >= 4 && x.energy === "alta") { p += 3; motivo.push("sua energia está boa para algo pesado"); }
    if (x.kind === "curso") { if (S.sessions.some(s => s.taskId === x.id && s.date === t)) p -= 3; else if (x.course.done > 0) motivo.push("manter o ritmo do curso"); }
    if (x.steps.length && x.steps.some(s => s.done) && x.steps.some(s => !s.done)) { p += 2; motivo.push("já está começada"); }
    const idade = Math.max(0, diff(t, x.created || t));
    p += Math.min(3, idade * .3);
    if (!motivo.length) motivo.push(idade >= 3 ? `está esperando há ${idade} dias` : "é a próxima da lista");
    return { x, p, motivo };
  }).sort((a, b) => b.p - a.p);
}

function spark(vals, cor = "var(--accent)") {
  const W = 100, H = 24, mx = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v, i) => [i * W / (n - 1), H - 2 - (v / mx) * (H - 4)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H} Z" fill="${cor}" opacity=".14"/><path d="${d}" fill="none" stroke="${cor}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}

let periodo = 14;

}
function eixoX(dados, L, bw, H) { const passo = Math.ceil(dados.length / 8); return dados.map((x, i) => (dados.length - 1 - i) % passo === 0 ? `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtData(x.d)}</text>` : "").join(""); }
function grafico(dados) {

  pts.forEach((p, i) => { if (p) g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--m1)" stroke-width="2.5"><title>${fmtData(dados[i].d)}: ${HUMOR[dados[i].mood]}</title></circle>`; });
  g += `<text x="${L - 6}" y="12" text-anchor="end" font-size="10" fill="var(--muted)">min</text><text x="${W - R + 6}" y="12" font-size="10" fill="var(--muted)">humor</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de foco por dia em barras e humor em linha">${g}</svg>`;
}
function graficoSono(dados) {
  const W = 640, H = 200, L = 44, R = 44, T = 26, B = 30, iw = W - L - R, ih = H - T - B, bw = iw / dados.length;

  g += `<rect x="${L}" y="${yS(9)}" width="${iw}" height="${yS(7) - yS(9)}" fill="var(--good)" opacity=".1"/><text x="${L + 4}" y="${yS(9) + 12}" font-size="10" fill="var(--good)">faixa de 7 a 9 h</text>`;
  dados.forEach((x, i) => { const cx = L + i * bw;
    if (x.sleepH != null) g += `<rect x="${cx + bw * .2}" y="${yS(x.sleepH)}" width="${bw * .6}" height="${T + ih - yS(x.sleepH)}" rx="3" fill="var(--m2)"><title>${fmtData(x.d)}: ${r1(x.sleepH)} h de sono</title></rect>`; });

function barras(rotulos, valores, { cor = "var(--accent)", meta = null, unidade = "", alt = "" } = {}) {

function asrsResultado(r) {

    : `<div class="note" style="border-color:var(--m1);background:var(--sunk)"><b>${r.positives} de 6 respostas na faixa de atenção.</b><p class="small">Abaixo do ponto de corte. Se as dificuldades atrapalham sua vida, converse com um profissional mesmo assim.</p></div>`;
}

function bind(root) {
  $$("[data-act]", root).forEach(el => el.addEventListener("click", ev => acao(el.dataset.act, el, ev)));
  const nm = $("#nome", root); if (nm) nm.addEventListener("change", () => { S.profile.name = nm.value.trim(); save(); });
  [["optMeds", "showMeds"], ["optBig", "big"], ["optCalm", "calm"], ["optGentle", "gentle"]].forEach(([id, k]) => {
    const el = $("#" + id, root); if (el) el.addEventListener("change", () => { S.settings[k] = el.checked; save(); render(); }); });
  const mk = $("#optMkt", root); if (mk) mk.addEventListener("change", async () => { try { await api("conta/marketing", { aceito: mk.checked }); S.link.marketing = mk.checked; lsSet(S); toast(mk.checked ? "Combinado." : "Você não recebe mais esses e-mails."); } catch (e) { toast(e.message); } });
  const cv = $("#convite", root); if (cv && S.conviteLink && !cv.value) cv.value = S.conviteLink;
  if (VIEW === "preparo") ligarPreparo(root);
  const lr = $("#optLembRot", root); if (lr) lr.addEventListener("change", () => { S.settings.lembretes.rotinas = lr.checked; save({ noSync: true }); });
  const ld = $("#lembDiario", root); if (ld) ld.addEventListener("change", () => { S.settings.lembretes.diario = ld.value; save({ noSync: true }); toast(ld.value ? "Lembrete do diário às " + ld.value + "." : "Lembrete do diário desligado."); });
  const meds = $("#meds", root); if (meds) meds.addEventListener("change", () => draft.meds = meds.checked);
  const dp = $("#dump", root); if (dp) dp.addEventListener("input", () => dumpTexto = dp.value);
  const note = $("#note", root); if (note) note.addEventListener("input", () => draft.note = note.value);
  if (VIEW === "mais" && pendingAnchor) { const el = $("#sec-" + pendingAnchor); pendingAnchor = null; if (el) el.scrollIntoView({ block: "start" }); }
}
let pendingAnchor = null;
const MANTEM_ROLAGEM = ["dumpEnergy", "dumpTipo", "dumpPrio", "filtro", "periodo", "set", "act", "acttype", "asrs", "skin", "sub", "lesson", "toggle"];

function acao(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case "demo-keep": S._keepDemo = true; toast("Fique à vontade. Seus toques não apagam nada real."); break;
    case "start-fresh": return sheetComeco();
    case "go": pendingAnchor = el.dataset.anchor || null; return go(el.dataset.v);
    case "quickmood": { const n = +el.dataset.n; S.checkins[hoje()] = Object.assign({ mood: n, energy: n }, S.checkins[hoje()] || {}, { mood: n }); save(); if (n === 1) apoio(); else toast("Anotado. Complete o diário quando quiser."); break; }
    case "dur": S.settings.focusMin = +el.dataset.n; save(); break;
    case "step": { const x = tarefa(id); x.steps[+el.dataset.i].done = true; if (x.steps.every(s => s.done)) { concluir(x); toast("Todos os passos feitos. Tarefa concluída!"); } else toast("Passo feito. Próximo!"); save(); break; }
    case "split": return sheetPassos(tarefa(id));
    case "focus": return abrirFoco(id);
    case "done": { if (id.startsWith("c:")) aulaFeita(curso(id.slice(2))); else { concluir(tarefa(id)); toast("Feito. Uma a menos."); } save(); break; }
    case "snooze": { const x = alvo(id); x.snooze = diasAtras(-1); x.pin = false; save(); toast("Sem culpa. Ela volta amanhã."); break; }
    case "pin": { S.tasks.forEach(x => x.pin = false); S.courses.forEach(x => x.pin = false); const x = alvo(id); x.pin = true; x.snooze = null; save(); break; }
    case "dump-now": adicionarLinhas($("#dumpNow").value, "media", "pessoal", "media"); break;
    case "dumpEnergy": dumpEnergy = el.dataset.e; break;
    case "dumpTipo": dumpTipo = el.dataset.e; break;
    case "dumpPrio": dumpPrio = el.dataset.e; break;
    case "dump": if (adicionarLinhas($("#dump").value, dumpEnergy, dumpTipo, dumpPrio)) dumpTexto = ""; break;
    case "sub": subTarefas = el.dataset.x; break;
    case "filtro": filtroTipo = el.dataset.x; break;
    case "toggle": { const x = tarefa(id); if (x.done) { x.done = false; x.doneAt = null; } else concluir(x); save(); break; }
    case "edit": return sheetTarefa(tarefa(id));
    case "showdone": mostrarFeitas = !mostrarFeitas; break;
    case "new-course": return sheetCurso(null);
    case "edit-course": return sheetCurso(curso(id));
    case "lesson": aulaFeita(curso(id)); save(); break;
    case "run-routine": return abrirRotina(S.routines.find(r => r.id === id));
    case "skip-routine": S.routineRuns.push({ date: hoje(), routineId: id, done: 0, total: 0, skipped: true }); save(); toast("Tudo bem. Amanhã tem de novo."); break;
    case "new-routine": return sheetRotina(null);
    case "edit-routine": return sheetRotina(S.routines.find(r => r.id === id));
    case "set": draft[el.dataset.f] = +el.dataset.n; break;
    case "sleep": draft.sleepH = Math.max(0, Math.min(14, draft.sleepH + +el.dataset.d)); $("#sleepOut").textContent = r1(draft.sleepH) + " h"; return;
    case "act": draft.activityMin = +el.dataset.n; if (!draft.activityMin) draft.activityType = ""; break;
    case "acttype": draft.activityType = el.dataset.x; if (!draft.activityMin) draft.activityMin = 20; break;
    case "save-checkin": {
      if (!draft.mood) { toast("Escolha pelo menos o humor."); return; }
      S.checkins[hoje()] = { ...draft }; const m = draft.mood; draft = null; save();
      if (m === 1) apoio(); else { toast("Dia salvo."); go("agora"); }
      return;
    }
    case "periodo": periodo = +el.dataset.n; break;
    case "dismiss-terapia": S.dismiss.terapia = hoje(); save(); break;
    case "asrs": asrsDraft[+el.dataset.i] = +el.dataset.j; break;
    case "asrs-save": {
      const pos = asrsDraft.filter((v, i) => v >= ASRS_CORTE[i]).length;
      S.screenings.push({ date: hoje(), type: "ASRS-A", answers: [...asrsDraft], positives: pos, positive: pos >= 4 });
      asrsDraft = null; save(); pendingAnchor = "triagem"; break;
    }
    case "interest": S.interest[el.dataset.p] = hoje(); save(); toast("Você entrou na lista. Avisamos quando o pagamento estiver pronto."); break;
    case "contact": return pedirContato();
    case "checkout": return comprar(el.dataset.plano);
    case "cancelar-assin": return sheetCancelar(+id, el.dataset.fim);
    case "portal": return abrirPortal(+id);
    case "esqueci": return sheetEsqueci();
    case "excluir-conta": return sheetExcluir();
    case "exportar-conta": return verMeusDados();
    case "nuvem-salvar": return nuvemSalvar(true);
    case "nuvem-restaurar": return nuvemRestaurar();
    case "notif-permissao": return pedirPermissaoNotif();
    case "imprimir": try { window.print(); } catch {} return;
    case "skin": S.settings.skin = el.dataset.x; aplicaTema(); save({ noSync: true }); break;
    case "export": return exportar();
    case "copia-restaurar": { const c = copias()[+el.dataset.i]; if (!c) return; guardarCopia("versão antes de voltar a uma cópia", S); const link = S.link; S = JSON.parse(c.dados); S.link = link; S._demo = false; migrar(); lsSet(S); aplicaTema(); toast("Cópia restaurada. A versão anterior também ficou guardada."); return go("agora"); }
    case "preparo": return go("preparo");
    case "importar-cursos": return sheetImportarCursos();
    case "import": return importar();
    case "wipe": return confirmarApagar();
    case "register": case "login": return entrar(a);
    case "link": return vincular();
    case "save-consent": return salvarConsent();
    case "sync": return sincronizar(true);
    case "unlink": return desvincular();
    case "servicos": evento("ver_servicos"); CAT = null; carregarServicos(); return go("servicos");
    case "servicos-recarregar": CAT = null; CAT_ERRO = ""; carregarServicos(true); break;
    case "svc-interesse": return sheetInteresse(el.dataset.i);
    case "svc-comprar": return comprarProduto(el.dataset.p);
    case "svc-turmas": return abrirTurmas(el.dataset.i);
    case "turma-inscrever": return inscreverTurma(+id);
    case "missao": return marcarMissao(+id, el.dataset.feita === "1");
    case "ebook-baixar": return baixarEbook(el.dataset.i);
    case "ajuda": return sheetAjuda();
    case "importar-tarefas": return sheetImportar();
    case "push-ligar": return pushLigar();
    case "push-desligar": return pushDesligar();
    case "logout": S.link = null; save({ noSync: true }); toast("Você saiu da conta. Seus dados continuam aqui."); break;
  }
  const y = window.scrollY; render(); if (MANTEM_ROLAGEM.includes(a)) window.scrollTo(0, y);
}
function aulaFeita(c) {
  if (!c) return; c.done = Math.min(c.total, c.done + 1); c.pin = false;
  toast(c.done >= c.total ? `Curso concluído: ${c.name}!` : `Aula ${c.done} de ${c.total} feita.`);
}
function concluir(x) { x.done = true; x.doneAt = hoje(); x.pin = false; x.steps.forEach(s => s.done = true); }
function adicionarLinhas(txt, energia, tipo, prio) {
  const linhas = txt.split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (!linhas.length) { toast("Escreva pelo menos uma linha."); return false; }
  linhas.forEach(t => S.tasks.push({ id: uid(), title: t.slice(0, 140), energy: energia, type: tipo, priority: prio, created: hoje(), steps: [], done: false }));
  save(); toast(linhas.length === 1 ? "Guardada." : `${linhas.length} tarefas guardadas.`); return true;
}
function aplicaTema() {
  const k = S.settings.skin || "auto";
  if (k === "auto") delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin = k;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim() || "#1f2a44";
}

/* ================= folhas (sheets) ================= */
function sheet(html, onBind) {
  const l = $("#layer");
  l.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="card">${html}</div></div>`;
  const sh = $(".sheet", l);
  sh.addEventListener("click", e => { if (e.target === sh) fechar(); });
  $$("[data-close]", sh).forEach(b => b.addEventListener("click", fechar));
  const first = $("input,textarea,button", sh); if (first) first.focus();
  onBind && onBind(sh);
}
function fechar() { $("#layer").innerHTML = ""; render(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer").innerHTML && !FOCO) fechar(); });
const chipsGrupo = (attr, opts, atual) => opts.map(([k, n, c]) => `<button class="chip" data-${attr}="${k}" aria-pressed="${atual === k}">${c ? `<span class="dotc" style="--c:${c}"></span>` : ""}${n}</button>`).join("");
function ligaChips(sh, attr, cb) { $$(`[data-${attr}]`, sh).forEach(b => b.onclick = () => { cb(b.dataset[attr]); $$(`[data-${attr}]`, sh).forEach(c => c.setAttribute("aria-pressed", c === b)); }); }

      $("#nd", sh).value.split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(t => S.tasks.push({ id: uid(), title: t, energy: "media", type: "pessoal", priority: "media", created: hoje(), steps: [], done: false }));

function sheetPassos(x) {
  sheet(`<h2>Quebrar em passos</h2><p class="small muted">${esc(x.title)}</p>

    $("#ok", sh).onclick = () => { const ant = Object.fromEntries(x.steps.map(s => [s.t, s.done]));

      x.title = $("#et", sh).value.trim() || x.title; x.energy = en; x.type = ty; x.priority = pr; const d = $("#ed", sh).value.trim(); x.due = /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null;
      x.steps = $("#es", sh).value.split(/\n+/).map(s => s.trim()).filter(Boolean).map(t => ({ t, done: !!ant[t] })); save(); fechar(); };

let FOCO = null, AUD = null;
function abrirFoco(taskId) {
  const x = itemPorId(taskId), total = S.settings.focusMin * 60;
  if (!x) return;
  FOCO = { taskId, type: x.type, curso: x.kind === "curso", total, end: Date.now() + total * 1000, paused: null, nextCheck: Date.now() + 10 * 60 * 1000, lastHB: 0 };
  $("#layer").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Modo foco"><div class="focusbox">
    <span class="label">Foco em</span><div class="row" style="justify-content:center">${tipoTag(x.type)}</div><h2 style="overflow-wrap:anywhere">${esc(x.title)}</h2>
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
      <div class="t"><b id="clock" aria-live="off">--:--</b><span class="small muted">restantes</span></div></div>
    <div class="row" style="justify-content:center"><button class="btn" id="fPause">Pausar</button><button class="btn" id="fDone">Terminei antes</button><button class="btn ghost" id="fStop">Sair</button></div>
    <div class="row" style="justify-content:center" role="group" aria-label="Som de fundo">${[["off", "silêncio"], ["white", "ruído branco"], ["pink", "rosa"], ["brown", "marrom"], ["chuva", "chuva", 1], ["ondas", "ondas", 1]].map(([k, n, p]) => `<button class="chip" data-snd="${k}" data-plus="${p ? 1 : ""}" aria-pressed="${S.settings.sound === k}">${n}${p && !PLUS() ? '<span class="mini">Plus</span>' : ""}</button>`).join("")}</div>
    <div class="card room"><span class="label">Sala de foco</span><div id="room" class="stack small" style="margin-top:8px"></div></div>
    <div id="checkin" hidden class="note" style="width:100%"><b>Ainda na tarefa?</b> <button class="btn sm" id="ciYes">Sim</button> <button class="btn sm ghost" id="ciNo">Me perdi, volto agora</button></div>
  </div></div>`;
  $("#fPause").onclick = () => { if (FOCO.paused) { FOCO.end += Date.now() - FOCO.paused; FOCO.paused = null; $("#fPause").textContent = "Pausar"; } else { FOCO.paused = Date.now(); $("#fPause").textContent = "Continuar"; } };

  document.title = (FOCO.paused ? "⏸ " : "") + c.textContent + " · Agora";
  if (S.settings.gentle && !FOCO.paused && Date.now() > FOCO.nextCheck && rest > 60) { $("#checkin").hidden = false; FOCO.nextCheck = Date.now() + 10 * 60 * 1000; }
  if (Date.now() - FOCO.lastHB > 30000) { FOCO.lastHB = Date.now(); salaBatimento(); }

function bip() {
  try { const ctx = AUD?.ctx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 660 + t * 400; g.gain.setValueAtTime(.0001, ctx.currentTime + t);

}
function som(tipo) {
  try {
    if (AUD?.src) { AUD.src.stop(); AUD.src = null; }
    if (tipo === "off") return;
    AUD = AUD || { ctx: new (window.AudioContext || window.webkitAudioContext)() };
    const ctx = AUD.ctx; ctx.resume();
    const n = ctx.sampleRate * 4, buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0, gota = 0;
    const sr = ctx.sampleRate;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1;
      if (tipo === "white") d[i] = w * .25;
      else if (tipo === "chuva") { last = (last + .06 * w) / 1.06; if (Math.random() < .0006) gota = .5 + Math.random() * .4; gota *= .996; d[i] = last * 1.6 + w * gota * .35; }
      else if (tipo === "ondas") { last = (last + .02 * w) / 1.02; d[i] = last * 3.2 * (.35 + .65 * Math.pow(Math.sin(Math.PI * i / (sr * 4)), 2)); }
      else if (tipo === "pink") { b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852; b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .06; b6 = w * .115926; }
      else { last = (last + .02 * w) / 1.02; d[i] = last * 2.8; } }
    const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = buf; src.loop = true; g.gain.value = .7;
    src.connect(g).connect(ctx.destination); src.start(); AUD.src = src;
  } catch { toast("Este navegador não tocou o som."); }
}

function abrirRotina(r) {
  let i = 0, end = 0; const ini = Date.now();
  const desenha = () => {
    const s = r.steps[i]; end = Date.now() + s.min * 60000;
    $("#layer").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Rotina ${esc(r.name)}"><div class="focusbox">
      <span class="label">${esc(r.name)} · passo ${i + 1} de ${r.steps.length}</span>
      <div class="row" style="justify-content:center">${r.steps.map((_, k) => `<span style="width:28px;height:6px;border-radius:3px;background:${k < i ? "var(--good)" : k === i ? "var(--accent)" : "var(--sunk)"}"></span>`).join("")}</div>
      <h1 style="font-size:clamp(1.6rem,6vw,2.4rem);overflow-wrap:anywhere">${esc(s.t)}</h1>
      <b id="rclock" class="mono" style="font-size:3rem">--:--</b>
      <button class="btn primary huge" id="rNext">${i + 1 < r.steps.length ? "Feito, próximo passo" : "Feito, terminar rotina"}</button>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="rStop">Parar aqui</button></div>
      ${i + 1 < r.steps.length ? `<p class="small muted">Depois: ${esc(r.steps[i + 1].t)}</p>` : ""}</div></div>`;
    $("#rNext").onclick = () => { i++; if (i < r.steps.length) desenha(); else fim(true); };
    $("#rStop").onclick = () => fim(false);
  };
  const fim = ok => {
    clearInterval(tm); document.title = "Agora TDAH";
    S.routineRuns.push({ date: hoje(), routineId: r.id, done: ok ? r.steps.length : i, total: r.steps.length });
    const min = Math.round((Date.now() - ini) / 60000); save();
    $("#layer").innerHTML = ""; render(); toast(ok ? `Rotina feita${min ? " em " + min + " min" : ""}.` : `${i} de ${r.steps.length} passos. Conta também.`);
  };
  const tm = setInterval(() => { const c = $("#rclock"); if (!c) return clearInterval(tm);
    const rest = Math.round((end - Date.now()) / 1000);
    c.textContent = rest >= 0 ? `${pad(Math.floor(rest / 60))}:${pad(rest % 60)}` : `+${pad(Math.floor(-rest / 60))}:${pad(-rest % 60)}`;
    c.style.color = rest < 0 ? "var(--warn)" : ""; if (rest === 0) bip(); document.title = c.textContent + " · " + r.name; }, 500);
  desenha();
}

function nuvemAgendar() { if (!API || !S.link?.token || !PLUS()) return; clearTimeout(nuvemTimer); nuvemTimer = setTimeout(() => nuvemSalvar(false), 15000); }
async function nuvemSalvar(manual, forcar) {
  try { const r = await api("nuvem", { dados: snapshot(), versao_base: S.link.nuvemVersao || 0, forcar: !!forcar });
    S.link.nuvemEm = r.atualizado_em; S.link.nuvemVersao = r.versao; lsSet(S); if (manual) { toast("Cópia salva na nuvem."); render(); } }
  catch (e) { if (e.status === 409) return sheetConflito(e.extra); if (manual) toast(e.message); }
}
const COPIAS = "agora.copias";
function copias() { try { return JSON.parse(localStorage.getItem(COPIAS) || "[]"); } catch { return []; } }
function guardarCopia(rotulo, dados) {  // até 3 cópias, para desfazer uma troca de versão
  try { const l = copias(); l.unshift({ quando: new Date().toISOString(), rotulo, dados: JSON.stringify(dados) }); localStorage.setItem(COPIAS, JSON.stringify(l.slice(0, 3))); return true; }
  catch { return false; }
}

/* ================= lembretes ================= */
async function agendarLembretes() {
  const LN = NATIVO(); if (!LN) return;
  try {
    const pend = await LN.getPending();
    const velhos = (pend.notifications || []).filter(n => n.id >= 1000 && n.id < 1950).map(n => ({ id: n.id }));
    if (velhos.length) await LN.cancel({ notifications: velhos });
    const lst = [];
    if (S.settings.lembretes.rotinas) S.routines.filter(r => r.time).slice(0, 40).forEach((r, i) => {
      const [h, m] = r.time.split(":").map(Number);
      lst.push({ id: 1000 + i, title: r.name, body: `Hora da rotina: ${r.steps.length} passos, ${r.steps.reduce((a, s) => a + s.min, 0)} min.`, schedule: { on: { hour: h, minute: m }, allowWhileIdle: true } });
    });
    if (S.settings.lembretes.diario) { const [h, m] = S.settings.lembretes.diario.split(":").map(Number);
      lst.push({ id: 1900, title: "Como foi o seu dia?", body: "Um toque no humor e pronto. Menos de um minuto.", schedule: { on: { hour: h, minute: m }, allowWhileIdle: true } }); }
    if (lst.length) await LN.schedule({ notifications: lst });
  } catch {}
}
async function pedirPermissaoNotif() {
  const LN = NATIVO();
  if (LN) { try { const r = await LN.requestPermissions(); toast(r.display === "granted" ? "Lembretes ligados." : "Sem permissão: os lembretes só aparecem com o app aberto."); agendarLembretes(); } catch {} return; }
  if (!("Notification" in window)) return toast("Este navegador não mostra notificações.");
  const p = await Notification.requestPermission();
  toast(p === "granted" ? "Lembretes ligados enquanto o app estiver aberto." : "Sem permissão: os lembretes aparecem só dentro do app.");
  render();
}
const lembrados = {};
function verificarLembretesWeb() {
  if (NATIVO()) return;
  const d = new Date(), hm = pad(d.getHours()) + ":" + pad(d.getMinutes()), t = hoje();
  const avisar = (chave, titulo, corpo) => {
    if (lembrados[chave] === t) return; lembrados[chave] = t; toast(titulo);
    try { if (window.Notification && Notification.permission === "granted") {
      (navigator.serviceWorker?.getRegistration?.() || Promise.resolve(null)).then(reg => reg ? reg.showNotification(titulo, { body: corpo, icon: "icon-192.png", tag: chave }) : new Notification(titulo, { body: corpo })).catch(() => {}); } } catch {}
  };
  if (S.settings.lembretes.rotinas) S.routines.forEach(r => { if (r.time === hm && !S.routineRuns.some(x => x.routineId === r.id && x.date === t)) avisar("r:" + r.id, "Hora de: " + r.name, "Abra o Agora para começar."); });
  if (S.settings.lembretes.diario === hm && !S.checkins[t]) avisar("diario", "Como foi o seu dia?", "Registre o humor em um toque.");
}

function lerListaTarefas(txt) {
  txt = String(txt || "").replace(/\r/g, "");
  const linhas = txt.split("\n").filter(l => l.trim());
  if (!linhas.length) return [];
  const sep = linhas[0].includes(";") && !linhas[0].includes(",") ? ";" : ",";
  const csv = l => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(c => c.trim()); };
  const cab = csv(linhas[0]).map(c => c.toLowerCase());
  const col = cab.findIndex(c => ["content", "title", "name", "nome", "tarefa", "título", "titulo", "task"].includes(c));
  let itens;
  if (cab.length > 1 && col >= 0) itens = linhas.slice(1).map(l => csv(l)[col]).filter(Boolean);
  else itens = linhas.map(l => l.replace(/^\s*(?:[-*+]\s*)?(?:\[[ xX]?\]\s*)?(?:\d+[.)]\s*)?/, "").trim());
  return itens.filter(t => t && t.length <= 200 && !/^(type|task)$/i.test(t)).slice(0, 200);
}

const b64uParaBytes = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); const b = atob(s + "=".repeat((4 - s.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };

/* ================= importar cursos (Lista Magna, painéis de cursos, planilhas) ================= */
// Aceita HTML com tabela ou lista, CSV/planilha exportada ou uma linha por curso. Cada curso entra dividido em 10 blocos,
// aproximação inicial que a pessoa ajusta depois. Nome repetido atualiza o curso em vez de duplicar.
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function dataDe(txt) {
  const m = String(txt || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})|(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  if (m[4]) return `${m[4]}-${m[5]}-${m[6]}`;
  const y = m[3].length === 2 ? "20" + m[3] : m[3];
  return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}
function lerCursos(txt, nomeArq) {
  txt = String(txt || ""); let linhas = [];
  if (/<table|<li|<tr/i.test(txt)) {
    const doc = new DOMParser().parseFromString(txt, "text/html");
    const tabs = [...doc.querySelectorAll("table")];
    tabs.forEach(t => { const rs = [...t.querySelectorAll("tr")].map(r => [...r.querySelectorAll("th,td")].map(c => c.textContent.replace(/\s+/g, " ").trim())); if (rs.length) linhas.push(...rs.map((r, i) => ({ r, cab: i === 0 }))); });
    if (!tabs.length) linhas = [...doc.querySelectorAll("li")].map(li => ({ r: [li.textContent.replace(/\s+/g, " ").trim()], cab: false }));
  } else {
    const ls = txt.replace(/\r/g, "").split("\n").filter(l => l.trim());
    const sep = ls[0] && ls[0].includes(";") && !ls[0].includes(",") ? ";" : ls[0] && ls[0].includes("\t") ? "\t" : ",";
    const csv = l => { const o = []; let c = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { o.push(c); c = ""; } else c += ch; } o.push(c); return o.map(x => x.trim()); };
    linhas = ls.map((l, i) => ({ r: /[,;\t]/.test(l) ? csv(l) : [l.replace(/^\s*(?:[-*+]\s*)?(?:\[[ xX]?\]\s*)?(?:\d+[.)]\s*)?/, "").trim()], cab: i === 0 }));
  }
  // cabeçalho: a primeira linha com nomes de coluna reconhecíveis
  const idx = linhas.findIndex(l => l.r.some(c => /curso|disciplina|t[ií]tulo|nome/i.test(c)) && l.r.length > 1);
  const cab = idx >= 0 ? linhas[idx].r.map(c => norm(c)) : null;
  const col = (...ps) => cab ? cab.findIndex(c => ps.some(p => c.includes(p))) : -1;
  const cN = cab ? col("curso", "disciplina", "titulo", "nome") : 0, cP = col("prazo", "acesso", "vence", "expira", "limite", "data"),
    cH = col("hora", "carga"), cS = col("status", "situacao"), cG = col("progresso", "concl", "%"), cPl = col("plataforma", "instituicao", "programa", "escola", "pos");
  const corpo = idx >= 0 ? linhas.slice(idx + 1) : linhas.filter(l => !l.cab || !cab);
  const vistos = new Set(), out = [];
  for (const { r } of corpo) {
    const nome = (r[cN >= 0 ? cN : 0] || "").trim();
    if (!nome || nome.length > 160 || /^(curso|disciplina|total|nome)$/i.test(nome) || vistos.has(norm(nome))) continue;
    vistos.add(norm(nome));
    const st = norm(cS >= 0 ? r[cS] : "");
    const pct = cG >= 0 ? parseFloat(String(r[cG]).replace(",", ".")) : NaN;
    const horas = cH >= 0 ? parseFloat(String(r[cH]).replace(",", ".")) : NaN;
    const concluido = /conclu|finaliz|aprovad/.test(st) || pct >= 100;
    out.push({ name: nome, platform: (cPl >= 0 ? r[cPl] : "") || (nomeArq ? "" : ""), deadline: cP >= 0 ? dataDe(r[cP]) : null,
      hours: isFinite(horas) && horas > 0 ? horas : null, total: 10, done: concluido ? 10 : isFinite(pct) ? Math.max(0, Math.min(10, Math.round(pct / 10))) : 0,
      status: st, marcar: !/expir|abandon|cancel/.test(st) });
  }
  return out.slice(0, 300);
}

  sheet(`<h2>Importar cursos</h2><p class="small muted">Lista Magna, painel de cursos salvo como página (.html), planilha (.csv) ou um curso por linha. Cada curso entra em 10 blocos, que você ajusta depois. Nome repetido atualiza o curso, sem duplicar.</p>

    const mostra = (txt, nome) => {

      prev.innerHTML = achados.length ? `<span class="label">${achados.length} curso(s) encontrados · ${achados.filter(c => ex.has(norm(c.name))).length} já existem e serão atualizados</span>
        <div class="stack" style="max-height:300px;overflow:auto;gap:4px">${achados.map((c, i) => `<label class="check"><input type="checkbox" data-ic="${i}" ${c.marcar ? "checked" : ""}><span>${esc(c.name)}<span class="small muted">${c.deadline ? " · prazo " + fmtData(c.deadline) : ""}${c.hours ? " · " + c.hours + " h" : ""}${c.status ? " · " + esc(c.status) : ""}${ex.has(norm(c.name)) ? " · atualizar" : ""}</span></span></label>`).join("")}</div>` : `<p class="small muted">${txt.trim() ? "Não encontrei cursos nesse conteúdo." : ""}</p>`;
      ok.disabled = !achados.length;
    };
    $("#icTxt", sh).addEventListener("input", e => mostra(e.target.value));
    $("#icArq", sh).addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; if (f.size > 5e6) return toast("Arquivo grande demais."); f.text().then(t => mostra(t, f.name)); });
    ok.onclick = () => {
      const marcados = achados.filter((_, i) => $(`[data-ic="${i}"]`, sh)?.checked);
      let novos = 0, atual = 0;
      marcados.forEach(c => {
        const ja = S.courses.find(x => norm(x.name) === norm(c.name));
        if (ja) { if (c.deadline) ja.deadline = c.deadline; if (c.hours) ja.hours = c.hours; if (c.done > ja.done && ja.total === 10) ja.done = c.done; atual++; }
        else { S.courses.push({ id: uid(), created: hoje(), name: c.name, platform: c.platform || "", total: c.total, done: c.done, hours: c.hours, deadline: c.deadline,
          priority: c.deadline && c.deadline <= diasAtras(-60) ? "alta" : "media", importado: true }); novos++; }
      });
      save(); fechar(); toast(`${novos} curso(s) novos, ${atual} atualizados.`);
    };
  });
}

})();
